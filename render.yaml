services:
  - type: web
    name: importafrota-prime-drive
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: SIPROV_MODE
        value: fake
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: importafrota.db
      # Opcional: cria esse usuário no primeiro start, se ele ainda não existir, sem
      # precisar de acesso a shell. Preencha com nome e senha fictícios na tela do
      # Render antes de criar o serviço; deixe em branco para não criar ninguém.
      - key: SEED_USUARIO_NOME
        sync: false
      - key: SEED_USUARIO_SENHA
        sync: false
